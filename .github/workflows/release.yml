name: Release

# Every change merged to main that raises VERSION in local_ai_installer.py is tested, built into
# downloadable programs and published as a GitHub Release automatically. Nothing to tag by hand.
# (Run manually from the Actions tab to only test the builds, without publishing.)
on:
  push:
    branches: [main]
    paths:
      - local_ai_installer.py
      - launchers/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.e.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(python3 tools/version.py)" >> "$GITHUB_OUTPUT"
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "VERSION ${{ steps.v.outputs.version }} is already released - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile local_ai_installer.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: LocalAIInstaller-Windows.exe, built: dist/LocalAIInstaller.exe }
          - { os: macos-latest, name: LocalAIInstaller-Mac, built: dist/LocalAIInstaller }
          - { os: ubuntu-latest, name: LocalAIInstaller-Linux, built: dist/LocalAIInstaller }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --console --name LocalAIInstaller local_ai_installer.py
      - name: Smoke test the built program
        run: ${{ matrix.built }} --version
      - run: python -c "import shutil; shutil.copy(r'${{ matrix.built }}', r'${{ matrix.name }}')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add the launchers (Mac one zipped so it keeps its "executable" flag)
        run: |
          chmod +x launchers/Install-Mac.command
          (cd launchers && zip -X ../assets/Install-Mac.zip Install-Mac.command)
          cp launchers/Install-Windows.bat launchers/Install-Linux.sh assets/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
