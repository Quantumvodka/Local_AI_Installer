name: End-to-end install test

# Really installs everything (Ollama, small models, Open WebUI) on a clean Windows / macOS / Linux machine,
# then runs the health check. Manual: Actions tab -> "End-to-end install test" -> Run workflow.
# On a pull request it only runs when the PR title contains "[e2e]".
on:
  workflow_dispatch:
  pull_request:

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[e2e]')
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the folders shortcuts go into (a fresh CI machine may not have them)
        shell: bash
        run: mkdir -p "$HOME/Desktop" "$HOME/.local/share/applications"

      - name: Install everything (small models only, to keep the test fast)
        run: python local_ai_installer.py --yes --no-vscode --no-open --max-gb 2 --debug

      - name: Health check
        run: python local_ai_installer.py --check

      - name: Run it again = update mode (must reuse everything, restart the chat, and still pass)
        run: python local_ai_installer.py --yes --no-open --max-gb 2

      - name: Open WebUI answers over HTTP
        shell: python
        run: |
          import json, os, urllib.request
          state = json.load(open(os.path.join(os.path.expanduser("~"), ".local_ai_installer", "state.json")))
          port = state["webui_port"]
          body = urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=20).read()
          print("webui /health ->", body)
          page = urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=20).read(2000)
          assert b"<html" in page.lower(), page

      - name: Shortcut exists and its target brings a stopped chat back
        shell: python
        run: |
          import importlib.util, json, os, subprocess, sys
          state_dir = os.path.join(os.path.expanduser("~"), ".local_ai_installer")
          state = json.load(open(os.path.join(state_dir, "state.json")))
          print("shortcuts:", state.get("shortcuts"))
          assert state.get("shortcuts"), "no shortcut was created"
          for p in state["shortcuts"]:
              assert os.path.exists(p), p
          copy = os.path.join(state_dir, "local_ai_installer.py")
          spec = importlib.util.spec_from_file_location("lai", copy)
          lai = importlib.util.module_from_spec(spec)
          sys.modules["lai"] = lai
          spec.loader.exec_module(lai)
          port = state["webui_port"]
          assert lai.webui_health(port), "the chat should be running after the install"
          assert lai.stop_webui(state, port), "could not stop the chat"
          assert not lai.webui_health(port), "the chat still answers after stop"
          cmd = lai.launcher_cmd(copy) + ["--no-open"]
          print("running what the shortcut runs:", cmd)
          assert subprocess.call(cmd) == 0
          assert lai.webui_health(port), "the shortcut target did not bring the chat back"
          print("OK: the shortcut target restarts the chat")

      - name: Logs
        if: always()
        shell: bash
        run: |
          for f in install.log ollama.log webui.log; do
            echo "=================== $f"; tail -n 80 "$HOME/.local_ai_installer/$f" 2>/dev/null || true
          done
